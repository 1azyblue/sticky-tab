<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 220px;
      padding: 12px;
      font-family: sans-serif;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input {
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #iconInput {
      width: 40px;
      text-align: center;
      font-size: 15px;
    }
    #nameInput {
      flex: 1;
      width: auto;
    }
    button {
      width: 100%;
      padding: 6px 0;
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .help-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: #4f7cff;
      text-decoration: none;
      cursor: pointer;
    }
    .help-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="row">
    <input id="iconInput" type="text" placeholder="🙂" maxlength="4" />
    <input id="nameInput" type="text" placeholder="탭 이름 입력" />
  </div>
  <button id="saveBtn">저장</button>
  <a id="helpLink" class="help-link">사용법 보기</a>
  <script src="popup.js"></script>
</body>
</html>
